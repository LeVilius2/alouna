server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Resolve the private Docker hostname again after Supabase container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ ^/supabase/(?<supabase_path>(?:auth|rest|realtime)/v1(?:/.*)?)$ {
        set $supabase_upstream http://${ALOUNA_SUPABASE_UPSTREAM};
        proxy_pass $supabase_upstream/$supabase_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # No Studio, metadata, pooler, storage, or catch-all gateway access.
    location /supabase/ { return 404; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        expires -1;
    }

    # HTML, the manifest and service worker must be revalidated on every release.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
