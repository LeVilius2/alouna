name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm seed:check
      - name: Check operator scripts
        run: |
          bash -n scripts/backup-database.sh scripts/verify-restore.sh supabase/tests/concurrency.sh
          python3 scripts/create-member.py --help
      - run: pnpm build
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Apply schema and test RLS against real PostgreSQL
        run: |
          createdb --template=template0 alouna_test
          export PGDATABASE=alouna_test
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0001_init.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0002_editor.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seed/seed.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seed/seed.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/editor.sql
          bash supabase/tests/concurrency.sh
